services:
  - type: web
    name: sniply-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: AWS_REGION
        value: ap-southeast-2
      - key: AWS_BEDROCK_MODEL_ID
        value: qwen.qwen3-coder-30b-a3b-instruct
      - key: AWS_BEDROCK_API_KEY
        sync: false
